# CD de onix-guard → despliega en el VPS (en push a main). Invoca el pipeline reutilizable.
name: cd
on:
  push:
    branches: [main]
jobs:
  cd:
    uses: levapo97-cell/onix-deploy/.github/workflows/reusable-cd.yml@main
    with:
      service: onix-guard
      health_port: "8083"
      health_path: "/healthz"
    secrets: inherit
