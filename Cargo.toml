[package]
name = "onix-guard"
version = "0.1.0"
edition = "2021"
description = "OnixGuard: seguridad + análisis. Redacta credenciales (SHA-256) y detecta error/repetición (norm → clean)."
license = "MIT"

[dependencies]
async-nats = "0.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
once_cell = "1"

[dev-dependencies]
# tests de redacción/detección usan solo el crate + serde_json
